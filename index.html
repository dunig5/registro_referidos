<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro VIP - D'UNIG SHOPPING</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;700&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at 50% 0%, #2c1202 0%, #110500 60%, #050200 100%); 
            background-color: #050200; 
        }
        
        .font-futurista { font-family: 'Orbitron', sans-serif; }
        
        .glow-orange-gold { 
            box-shadow: 0 0 35px rgba(249, 115, 22, 0.2), inset 0 0 15px rgba(234, 179, 8, 0.1); 
        }
        
        .glass-panel { 
            background: linear-gradient(135deg, rgba(40, 15, 2, 0.5) 0%, rgba(15, 5, 0, 0.75) 100%); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(245, 158, 11, 0.15); 
        }
        
        .grid-bg { 
            background-image: linear-gradient(rgba(245, 158, 11, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(245, 158, 11, 0.02) 1px, transparent 1px); 
            background-size: 36px 36px; 
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; }
    </style>
</head>
<body class="text-orange-100 antialiased min-h-screen flex flex-col justify-between grid-bg relative selection:bg-amber-500 selection:text-black">

    <!-- Header Futurista -->
    <header class="bg-black/60 backdrop-blur-xl border-b border-orange-950/80 sticky top-0 z-40 px-4">
        <div class="max-w-4xl mx-auto h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="border border-amber-500/40 p-2.5 rounded-2xl bg-orange-950/50 glow-orange-gold">
                    <i data-lucide="shield-check" class="w-6 h-6 text-amber-400"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-black tracking-[0.2em] text-white font-futurista">
                        D'UNIG <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-amber-400 to-yellow-400">SHOPPING</span>
                    </h1>
                    <p class="text-[8px] text-amber-400/80 uppercase tracking-[0.3em] font-bold font-futurista">
                        ACCESS SYSTEM // VIP
                    </p>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-xl w-full mx-auto px-4 py-12 flex-grow flex items-center justify-center relative z-10">
        <div class="glass-panel p-8 sm:p-10 rounded-3xl shadow-2xl w-full space-y-6 glow-orange-gold">
            
            <div class="text-center space-y-2">
                <span class="text-[9px] uppercase tracking-[0.25em] font-futurista font-black text-amber-400 bg-amber-500/10 px-3.5 py-1.5 rounded-full border border-amber-500/20">REGISTRO DE CREDENCIALES</span>
                <h2 class="text-2xl sm:text-3xl font-black font-futurista text-white tracking-wider uppercase pt-1">Nuevo Registro</h2>
                <p class="text-xs text-orange-200/60 font-medium">Completa los campos para generar tu código de acceso exclusivo.</p>
            </div>

            <!-- Formulario -->
            <form id="form-referido" onsubmit="registrarReferido(event)" class="space-y-4.5">
                
                <div class="space-y-1.5">
                    <label class="text-[9px] uppercase text-amber-400/80 font-bold tracking-widest block font-futurista">Nombre Completo</label>
                    <input type="text" id="ref-nombre" required placeholder="Ej. Valeria Silva" class="w-full bg-black/40 border border-orange-900/60 text-xs text-white p-4 rounded-xl focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400/50 font-medium transition-all">
                </div>

                <div class="space-y-1.5">
                    <label class="text-[9px] uppercase text-amber-400/80 font-bold tracking-widest block font-futurista">Cédula de Identidad</label>
                    <input type="text" id="ref-cedula" required placeholder="Ej. V-28000000" class="w-full bg-black/40 border border-orange-900/60 text-xs text-white p-4 rounded-xl focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400/50 font-mono transition-all">
                </div>

                <div class="space-y-1.5">
                    <label class="text-[9px] uppercase text-amber-400/80 font-bold tracking-widest block font-futurista">Número de Teléfono</label>
                    <input type="tel" id="ref-telefono" required placeholder="Ej. 04120000000" class="w-full bg-black/40 border border-orange-900/60 text-xs text-white p-4 rounded-xl focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400/50 font-mono transition-all">
                </div>

                <div class="space-y-1.5">
                    <label class="text-[9px] uppercase text-amber-400/80 font-bold tracking-widest block font-futurista">Ciudad</label>
                    <input type="text" id="ref-ciudad" required placeholder="Ej. Caracas" class="w-full bg-black/40 border border-orange-900/60 text-xs text-white p-4 rounded-xl focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400/50 font-medium transition-all">
                </div>

                <button type="submit" id="btn-enviar" class="w-full bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-400 hover:from-orange-600 hover:to-yellow-500 text-black font-futurista font-black py-4 px-6 rounded-xl text-xs uppercase tracking-[0.2em] flex items-center justify-center gap-2 cursor-pointer shadow-xl shadow-orange-950 transition-all duration-300 mt-6 active:scale-[0.98]">
                    <i data-lucide="key-round" class="w-4 h-4"></i> GENERAR CÓDIGO VIP
                </button>
            </form>

            <!-- Sección de Éxito -->
            <div id="seccion-exito" class="hidden space-y-6 text-center py-6">
                <div class="w-20 h-20 bg-gradient-to-br from-orange-500/20 to-amber-500/20 border border-amber-500/40 rounded-2xl mx-auto flex items-center justify-center text-amber-400 shadow-lg glow-orange-gold">
                    <i data-lucide="sparkles" class="w-9 h-9 animate-pulse"></i>
                </div>
                <div class="space-y-2">
                    <h3 class="text-xl font-black font-futurista text-white uppercase tracking-wider">¡Registro Exitoso!</h3>
                    <p class="text-xs text-orange-200/70">Tu código exclusivo ha sido generado con éxito en el sistema.</p>
                </div>

                <div class="bg-black/60 border border-amber-500/40 p-5 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-inner">
                    <span id="codigo-generado-txt" class="font-mono text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-yellow-400 tracking-widest">0000000ABC</span>
                    <button onclick="copiarCodigo()" class="w-full sm:w-auto bg-gradient-to-r from-amber-400 to-yellow-400 hover:from-amber-500 hover:to-yellow-500 text-black font-futurista text-xs font-black px-6 py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all cursor-pointer shadow-md active:scale-95">
                        <i data-lucide="copy" class="w-4 h-4"></i> COPIAR CÓDIGO
                    </button>
                </div>

                <button onclick="reiniciarFormulario()" class="w-full bg-orange-950/40 hover:bg-orange-900/60 text-orange-200 font-futurista py-3.5 px-6 rounded-xl text-[10px] uppercase tracking-wider border border-orange-800/40 transition-all cursor-pointer">
                    Registrar otro usuario
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-orange-950/80 bg-black/80 p-4 text-center text-[10px] text-orange-400/40 font-mono tracking-widest">
        © 2026 D'UNIG LUXURY ECOSISTEMA. SEGURIDAD Y PREstigio.
    </footer>

    <!-- Lógica de Conexión y Generación -->
    <script>
        const SUPABASE_URL = "https://cmaishgahyzlhszwaozg.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtYWlzaGdhaHl6bGhzendhb3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MjMxMzEsImV4cCI6MjEwMDQ5OTEzMX0.8JVrpQKocnyZa3qLxsX9ZxjygYy4QY3kp_VSvrL1qNQ"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', () => { 
            lucide.createIcons(); 
        });

        function generarCodigoVIP() {
            let numeros = "";
            for (let i = 0; i < 7; i++) {
                numeros += Math.floor(Math.random() * 10);
            }
            const letrasPosibles = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let letras = "";
            for (let i = 0; i < 3; i++) {
                letras += letrasPosibles.charAt(Math.floor(Math.random() * letrasPosibles.length));
            }
            return numeros + letras; 
        }

        async function registrarReferido(event) {
            event.preventDefault();

            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> PROCESANDO...`;
            lucide.createIcons();

            const nombre = document.getElementById('ref-nombre').value.trim();
            const cedula = document.getElementById('ref-cedula').value.trim();
            const telefono = document.getElementById('ref-telefono').value.trim();
            const ciudad = document.getElementById('ref-ciudad').value.trim();
            const codigoGenerado = generarCodigoVIP();

            // Sincronizado estrictamente con la tabla 'afiliados_referidos'
            const { data, error } = await supabaseClient.from('afiliados_referidos').insert([{
                nombre: nombre,
                cedula: cedula,
                telefono: telefono,
                ciudad: ciudad,
                codigo_referido: codigoGenerado
            }]).select();

            if (error) {
                console.error("Error técnico de Supabase:", error);
                alert("Error al procesar el registro: " + error.message);
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="key-round" class="w-4 h-4"></i> GENERAR CÓDIGO VIP`;
                lucide.createIcons();
            } else {
                console.log("¡Registro guardado con éxito!", data);
                document.getElementById('form-referido').classList.add('hidden');
                document.getElementById('codigo-generado-txt').innerText = codigoGenerado;
                document.getElementById('seccion-exito').classList.remove('hidden');
                lucide.createIcons();
            }
        }

        function copiarCodigo() {
            const codigo = document.getElementById('codigo-generado-txt').innerText;
            navigator.clipboard.writeText(codigo).then(() => {
                alert("¡Código copiado al portapapeles con éxito!");
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }

        function reiniciarFormulario() {
            document.getElementById('form-referido').reset();
            document.getElementById('seccion-exito').classList.add('hidden');
            document.getElementById('form-referido').classList.remove('hidden');
            const btn = document.getElementById('btn-enviar');
            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="key-round" class="w-4 h-4"></i> GENERAR CÓDIGO VIP`;
            lucide.createIcons();
        }
    </script>
</body>
</html>
